id = "lidengyin.apifox-sync"
name = "Apifox Sync"
version = "0.11.2"
description = "读取项目里的 Spring Controller 源码，生成 OpenAPI 3.0 并同步到 Apifox 项目：无需启动服务、不用 Swagger，按代码模块映射项目/分支/模块/目录，同步后给出每个模块的导入结果统计。"
change-notes = """
0.11.2
- 修复：分支/模块列表加载失败（如 HTTP 503）时，打开映射行再点「保存」会把已存的分支/模块 ID 清空，下一次同步丢掉目标分支。现在未改动即保留原 ID，只有显式选择「(主分支)」「(默认模块)」才会重置。
- 修复：导出的 docs/openapi.yaml 中，数组内对象的续行缩进不合法，含 @RequestParam 的接口导出后 PyYAML 报 expected <block end>；改用对齐的块式输出，导出的 YAML 可被 PyYAML 解析且与 JSON 文档完全等价。

0.11.1
- 映射：读 pom.xml / settings.gradle 检测代码模块；团队 → Apifox 项目、分支/版本、模块、接口与数据模型目录全部下拉选择，覆盖策略与参数命名转换可配。
- 同步：同步全部只跑启用的行；在项目视图右键某个 .java 或目录时只导出选中范围内的接口（类型仍按全项目解析）。
- 结果：导入结果按模块列出项目/分支/模块/目录与接口清单，含 Created / Updated / Ignored / Failed 计数，失败的模块显示原因。
- 导出：OpenAPI YAML、OpenAPI JSON、Postman Collection。
- 配置：项目根 .apifox-sync.json 可一键导入全部映射。
"""
authors = ["lidengyin"]
homepage = "https://github.com/lidengyin/openidea-apifox-sync"
license = "MIT"
categories = ["frameworks", "tools"]
icon = "icon.svg"
# Built with openidea-plugin 0.1.46 (plugin API 1.9); storage/secrets/net/http
# would also run on 1.4, but the manifest states the API the component was
# built for so older IDEs get an older package instead of a load error.
engines.openidea = "^1.9"
# Built by `openidea-plugin build`; loaded the first time a command runs.
wasm = "dist/plugin.wasm"

# Everything the code may do. The user approves this list at install time.
[capabilities]
required = ["project.read", "project.write", "storage", "secrets", "net:api.apifox.com", "net:ask"]

# The Apifox personal access token. It lives in the OS keychain; the plugin
# never reads it — requests carry `{{secret:apifox_token}}` and the host fills
# it in on the way out.
[[contributes.secrets]]
name = "apifox_token"
label = "Apifox 访问令牌"
description = "Apifox → 账号设置 → API 访问令牌（请求以 Bearer 发送）。"

[[contributes.commands]]
id = "sync-apifox"
title = "Apifox Sync: 同步接口到 Apifox"
category = "Apifox Sync"

[[contributes.commands]]
id = "export-yaml"
title = "Apifox Sync: 导出 OpenAPI YAML"
category = "Apifox Sync"

[[contributes.commands]]
id = "export-postman"
title = "Apifox Sync: 导出 Postman Collection"
category = "Apifox Sync"

[[contributes.commands]]
id = "export-openapi"
title = "Apifox Sync: 导出 OpenAPI JSON"
category = "Apifox Sync"

[[contributes.commands]]
id = "configure-apifox"
title = "Apifox Sync: 配置项目 ID / 访问令牌"
category = "Apifox Sync"

# The settings page (server / token / project / branch / module / mapping table)
# shows up as a tool window on the right, like ApifoxHelper's settings tab.
[[contributes.views]]
id = "settings"
title = "Apifox Sync"
icon = "icon.svg"
location = "right"
group = "apifox"

# The mapping table gets its own tab: a view body is a single Form or Table.
[[contributes.views]]
id = "mapping"
title = "映射"
icon = "icon.svg"
location = "right"
group = "apifox"

# Upload result: the per-module import report the reference plugin prints into
# its console (project/branch/module/folders + created/updated/ignored/failed).
[[contributes.views]]
id = "report"
title = "导入结果"
icon = "icon.svg"
location = "right"
group = "apifox"

# Right-click a controller file or folder in the Project view.
[[contributes.menus]]
menu = "projectView.context"
command = "sync-apifox"
submenu = "Apifox Sync"

[[contributes.menus]]
menu = "projectView.context"
command = "export-yaml"
submenu = "Apifox Sync"

[[contributes.menus]]
menu = "projectView.context"
command = "export-postman"
submenu = "Apifox Sync"

[[contributes.menus]]
menu = "projectView.context"
command = "export-openapi"
submenu = "Apifox Sync"

[[contributes.menus]]
menu = "projectView.context"
command = "configure-apifox"
submenu = "Apifox Sync"